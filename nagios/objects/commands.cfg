##############################################################################
# Command Definitions - FairSplit-Ops DevOps Project
# Nagios Core 4
##############################################################################

# ---------------------------------------------------------------------------
# NRPE CHECK COMMANDS
# ---------------------------------------------------------------------------

# Standard NRPE check (no arguments passed to remote plugin)
define command {
    command_name    check_nrpe
    command_line    /usr/lib/nagios/plugins/check_nrpe -H $HOSTADDRESS$ -c $ARG1$
}

# NRPE check with one argument forwarded to the remote plugin
define command {
    command_name    check_nrpe_arg
    command_line    /usr/lib/nagios/plugins/check_nrpe -H $HOSTADDRESS$ -c $ARG1$ -a $ARG2$
}

# ---------------------------------------------------------------------------
# EVENT HANDLER: SERVICE REMEDIATION
# ---------------------------------------------------------------------------
# Called by Nagios when a service state changes.
# ARG1 = service name label (used by the remediation script to pick the right
#        corrective action).
# The script receives the standard Nagios event-handler environment args:
#   $SERVICESTATE$  $SERVICESTATETYPE$  $SERVICEATTEMPT$  <service_label>
#
define command {
    command_name    check_service_remediate
    command_line    /etc/nagios4/scripts/remediate.sh $SERVICESTATE$ $SERVICESTATETYPE$ $SERVICEATTEMPT$ $ARG1$
}

# ---------------------------------------------------------------------------
# STANDARD CHECK COMMANDS
# (Included here as overrides / supplements to the Nagios defaults so that
#  our config is self-contained. If nagios4 ships them in commands.cfg or
#  conf.d, these definitions are ignored or can be removed.)
# ---------------------------------------------------------------------------

# HTTP check (used for direct checks from the Ops Node if ever needed)
define command {
    command_name    check_http
    command_line    /usr/lib/nagios/plugins/check_http -I $HOSTADDRESS$ $ARG1$
}

# SSH check
define command {
    command_name    check_ssh
    command_line    /usr/lib/nagios/plugins/check_ssh -p $ARG1$ $HOSTADDRESS$
}

# Disk check (local, used on Ops Node directly if NRPE is unavailable)
define command {
    command_name    check_disk
    command_line    /usr/lib/nagios/plugins/check_disk -w $ARG1$ -c $ARG2$ -p $ARG3$
}

# Load check (local)
define command {
    command_name    check_load
    command_line    /usr/lib/nagios/plugins/check_load -w $ARG1$ -c $ARG2$
}

# Memory check (local, wraps our custom plugin)
define command {
    command_name    check_mem
    command_line    /usr/local/lib/nagios/plugins/check_mem.sh $ARG1$
}
