##############################################################################
# Custom Command Definitions - FairSplit-Ops DevOps Project
# Note: Standard commands (check_nrpe, check_http, check_tcp, check_ssh,
#       check_disk, check_load) are provided by /etc/nagios-plugins/config/*.cfg.
##############################################################################

# ---------------------------------------------------------------------------
# EVENT HANDLER: SERVICE REMEDIATION
# ---------------------------------------------------------------------------
define command {
    command_name    check_service_remediate
    command_line    /usr/bin/sudo -u ubuntu /opt/fairsplit/remediation/event_handlers/nagios_event_handler.sh $SERVICESTATE$ $SERVICESTATETYPE$ $SERVICEATTEMPT$ "$SERVICEDESC$"
}

# ---------------------------------------------------------------------------
# CUSTOM APPLICATION CHECKS
# ---------------------------------------------------------------------------

# Frontend HTTP check (properly unquoted port and URI)
define command {
    command_name    check_fairsplit_frontend
    command_line    /usr/lib/nagios/plugins/check_http -H $HOSTADDRESS$ -p 80 -u /
}

# FairSplit API Health (validates HTTP 200, status=healthy, database=connected)
define command {
    command_name    check_fairsplit_api
    command_line    /usr/lib/nagios/plugins/check_fairsplit_api.sh $HOSTADDRESS$ 80 /api/health/ 10
}

# FairSplit Database Connectivity (checks database=connected via real health endpoint)
define command {
    command_name    check_fairsplit_db
    command_line    /usr/lib/nagios/plugins/check_fairsplit_db.sh $HOSTADDRESS$ 80 /api/health/ 10
}

# Memory usage check
define command {
    command_name    check_mem
    command_line    /usr/lib/nagios/plugins/check_mem.sh $ARG1$ $ARG2$
}
