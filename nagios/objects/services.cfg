##############################################################################
# Service Definitions - FairSplit-Ops DevOps Project
##############################################################################

# ---------------------------------------------------------------------------
# OPS NODE SERVICES (fairsplit-ops)
# ---------------------------------------------------------------------------

# SSH connectivity check
define service {
    use                     generic-service
    host_name               fairsplit-ops
    service_description     SSH
    check_command           check_ssh
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
    event_handler_enabled   1
}

# Disk usage on Ops Node via NRPE
define service {
    use                     generic-service
    host_name               fairsplit-ops
    service_description     Disk Usage /
    check_command           check_nrpe!check_disk
    check_interval          10
    retry_interval          2
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
    event_handler_enabled   1
}

# System load on Ops Node via NRPE
define service {
    use                     generic-service
    host_name               fairsplit-ops
    service_description     System Load
    check_command           check_nrpe!check_load
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    notification_interval   30
    notification_period     24x7
    notification_options    w,u,c,r
    contact_groups          admins
    event_handler_enabled   1
}

