##############################################################################
# Service Definitions - FairSplit-Ops DevOps Project
##############################################################################

# ---------------------------------------------------------------------------
# OPS NODE SERVICES (fairsplit-ops)
# ---------------------------------------------------------------------------

# SSH connectivity check
define service {
    use                     generic-service
    host_name               fairsplit-ops
    service_description     SSH
    check_command           check_ssh!22
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    contact_groups          admins
}

# Disk usage on Ops Node
define service {
    use                     generic-service
    host_name               fairsplit-ops
    service_description     Disk Usage /
    check_command           check_disk!20%!10%!/
    check_interval          10
    retry_interval          2
    max_check_attempts      3
    check_period            24x7
    contact_groups          admins
}

# System load on Ops Node (requires 6 arguments for warning and critical triplets)
define service {
    use                     generic-service
    host_name               fairsplit-ops
    service_description     System Load
    check_command           check_load!5.0!4.0!3.0!10.0!8.0!6.0
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    contact_groups          admins
}

# Memory usage on Ops Node
define service {
    use                     generic-service
    host_name               fairsplit-ops
    service_description     Memory Usage
    check_command           check_mem!80!90
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    contact_groups          admins
}

# Puppet Server port check on Ops Node
define service {
    use                     generic-service
    host_name               fairsplit-ops
    service_description     Puppet Server
    check_command           check_tcp!8140
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    contact_groups          admins
}

# ---------------------------------------------------------------------------
# APP NODE SERVICES (fairsplit-app)
# ---------------------------------------------------------------------------

# SSH connectivity check on App Node
define service {
    use                     generic-service
    host_name               fairsplit-app
    service_description     SSH
    check_command           check_ssh!22
    check_interval          5
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    contact_groups          admins
}

# HTTP Frontend check on port 80 (Direct check from Ops)
define service {
    use                     generic-service
    host_name               fairsplit-app
    service_description     FairSplit Frontend
    check_command           check_fairsplit_frontend
    check_interval          2
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    contact_groups          admins
    event_handler_enabled   1
    event_handler           check_service_remediate
}

# Django API Health Check (Direct check from Ops, verifies HTTP 200 & healthy status)
define service {
    use                     generic-service
    host_name               fairsplit-app
    service_description     FairSplit API Health
    check_command           check_fairsplit_api
    check_interval          2
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    contact_groups          admins
    event_handler_enabled   1
    event_handler           check_service_remediate
}

# PostgreSQL Database Connectivity Check (Via real API health status)
# Note: Automatic remediation is deliberately not attached to prevent data loss.
define service {
    use                     generic-service
    host_name               fairsplit-app
    service_description     PostgreSQL Database
    check_command           check_fairsplit_db
    check_interval          2
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    contact_groups          admins
    event_handler_enabled   0
}

# Docker container: fairsplit_frontend via NRPE
define service {
    use                     generic-service
    host_name               fairsplit-app
    service_description     Docker Container fairsplit_frontend
    check_command           check_nrpe!check_docker_frontend
    check_interval          2
    retry_interval          1
    max_check_attempts      3
    check_period            24x7
    contact_groups          admins
    event_handler_enabled   1
    event_handler           check_service_remediate
}

