##############################################################################
# Host Definitions - FairSplit-Ops DevOps Project
##############################################################################

# ---------------------------------------------------------------------------
# OPS NODE
# ---------------------------------------------------------------------------
define host {
    use                     generic-host
    host_name               fairsplit-ops
    alias                   FairSplit Ops Node
    address                 127.0.0.1
    check_command           check_tcp!22
    max_check_attempts      3
    check_period            24x7
    check_interval          5
    retry_interval          1
    notification_interval   30
    notification_period     24x7
    notification_options    d,u,r
    contact_groups          admins
}

# ---------------------------------------------------------------------------
# APP NODE
# ---------------------------------------------------------------------------
# Note: AWS Security Group blocks ICMP echo requests; check_command uses
# check_tcp!80 to reliably verify host availability without false alerts.
define host {
    use                     generic-host
    host_name               fairsplit-app
    alias                   FairSplit App Node
    address                 172.31.14.13
    check_command           check_tcp!80
    max_check_attempts      3
    check_period            24x7
    check_interval          5
    retry_interval          1
    notification_interval   30
    notification_period     24x7
    notification_options    d,u,r
    contact_groups          admins
}
