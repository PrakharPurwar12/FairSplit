##############################################################################
# Host Definitions - FairSplit-Ops DevOps Project
# Addresses are populated post-provisioning (Terraform outputs -> Ansible vars)
##############################################################################

# ---------------------------------------------------------------------------
# OPS NODE
# ---------------------------------------------------------------------------
define host {
    use                     linux-server
    host_name               fairsplit-ops
    alias                   FairSplit Ops Node
    address                 127.0.0.1               ; # OPS_NODE_IP
    max_check_attempts      3
    check_period            24x7
    check_interval          5
    retry_interval          1
    notification_interval   30
    notification_period     24x7
    notification_options    d,u,r
    contact_groups          admins
    icon_image              base/linux40.png
    icon_image_alt          Linux Server
    statusmap_image         base/linux40.gd2
}

# ---------------------------------------------------------------------------
# APP NODE
# ---------------------------------------------------------------------------
define host {
    use                     linux-server
    host_name               fairsplit-app
    alias                   FairSplit App Node
    address                 127.0.0.2               ; # APP_NODE_IP
    max_check_attempts      3
    check_period            24x7
    check_interval          5
    retry_interval          1
    notification_interval   30
    notification_period     24x7
    notification_options    d,u,r
    contact_groups          admins
    icon_image              base/linux40.png
    icon_image_alt          Linux Server
    statusmap_image         base/linux40.gd2
}
