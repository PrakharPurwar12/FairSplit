##############################################################################
# Nagios CGI Configuration File
# FairSplit-Ops DevOps Project
##############################################################################

# ---------------------------------------------------------------------------
# MAIN CONFIG FILE
# ---------------------------------------------------------------------------
main_config_file=/etc/nagios4/nagios.cfg

# ---------------------------------------------------------------------------
# HTML / URL PATHS
# ---------------------------------------------------------------------------
physical_html_path=/usr/share/nagios4/htdocs
url_html_path=/nagios4

# ---------------------------------------------------------------------------
# AUTHENTICATION
# ---------------------------------------------------------------------------
use_authentication=1
default_user_name=nagiosadmin

# ---------------------------------------------------------------------------
# AUTHORIZATION
# ---------------------------------------------------------------------------
authorized_for_system_information=nagiosadmin
authorized_for_configuration_information=nagiosadmin
authorized_for_system_commands=nagiosadmin
authorized_for_all_services=nagiosadmin
authorized_for_all_hosts=nagiosadmin
authorized_for_all_service_commands=nagiosadmin
authorized_for_all_host_commands=nagiosadmin

# ---------------------------------------------------------------------------
# DISPLAY OPTIONS
# ---------------------------------------------------------------------------
show_context_help=1
use_pending_states=1
refresh_rate=30
escape_html_tags=1
result_limit=100
sticky_acknowledgement=0

# ---------------------------------------------------------------------------
# SOUND / ALERT
# ---------------------------------------------------------------------------
# host_unreachable_sound=hostdown.wav
# host_down_sound=hostdown.wav
# service_critical_sound=critical.wav
# service_warning_sound=warning.wav
# service_unknown_sound=warning.wav

# ---------------------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------------------
url_cgi_path=/cgi-bin/nagios4/
