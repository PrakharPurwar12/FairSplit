# ==============================================================================
# FairSplit - Code Quality & Linting Workflow
# ==============================================================================
# Objective: Enforce code formatting, import ordering, and linting standards
# across Python backend and React frontend codebases.
# ==============================================================================

name: Code Linting

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ----------------------------------------------------------------------------
  # Job 1: Python Code Quality (Backend)
  # ----------------------------------------------------------------------------
  python-lint:
    name: Python Linting & Formatting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install minimal Python linters
        run: |
          python -m pip install --upgrade pip
          pip install black isort flake8

      - name: Check code formatting with Black
        run: |
          black --check backend/

      - name: Check import order with isort
        run: |
          isort --check-only backend/

      - name: Check code style with flake8
        run: |
          flake8 backend/ --max-line-length=120 --extend-ignore=E203,W503

  # ----------------------------------------------------------------------------
  # Job 2: Frontend Code Quality (React / ESLint)
  # ----------------------------------------------------------------------------
  frontend-lint:
    name: Frontend Linting (ESLint)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci

      - name: Run ESLint
        run: |
          npm run lint
