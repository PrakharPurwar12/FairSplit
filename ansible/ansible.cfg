[defaults]
inventory          = inventory/hosts.ini
remote_user        = ubuntu
private_key_file   = ~/.ssh/terra-server-key.pem
host_key_checking  = False
retry_files_enabled = False
stdout_callback    = yaml
timeout            = 30

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=60
pipelining = True
