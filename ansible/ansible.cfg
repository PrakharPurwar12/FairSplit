[defaults]
inventory          = inventory/hosts.ini
remote_user        = ubuntu
private_key_file   = ~/.ssh/fairsplit_ansible
host_key_checking  = True
retry_files_enabled = False
stdout_callback    = yaml
timeout            = 30

[ssh_connection]
ssh_args = -o StrictHostKeyChecking=yes -o UserKnownHostsFile=~/.ssh/known_hosts -o ServerAliveInterval=60
pipelining = True
