# Ansible Inventory for FairSplit-Ops
# Architecture: Ops Node & App Node
# Note: This file can also be dynamically generated by Terraform into this location.

[ops]
ops-node ansible_host=127.0.0.1 ansible_connection=local ansible_user=ubuntu

[app]
app-node ansible_host=app-node ansible_user=ubuntu

[fairsplit:children]
ops
app

[all:vars]
ansible_ssh_common_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'
ansible_python_interpreter=/usr/bin/python3
ansible_ssh_private_key_file=~/.ssh/terra-server-key.pem
