---
- name: Automated Service Remediation
  hosts: app
  become: true
  gather_facts: true

  vars:
    service_name: "{{ service_name | default('') }}"
    compose_working_dir: "{{ app_dir }}"
    compose_file: docker-compose.yml
    remediation_log: /opt/fairsplit/remediation.log
    escalation_flag: /opt/fairsplit/ESCALATION_NEEDED
    wait_after_restart: 30
    health_check_retries: 6
    health_check_delay: 10

    # Service name to container name bidirectional mapping
    service_to_container:
      backend: fairsplit_backend
      fairsplit_backend: fairsplit_backend
      postgres: fairsplit_postgres
      fairsplit_postgres: fairsplit_postgres
      frontend: fairsplit_frontend
      fairsplit_frontend: fairsplit_frontend

    # Container name to docker-compose service name mapping
    service_to_compose_service:
      backend: backend
      fairsplit_backend: backend
      postgres: postgres
      fairsplit_postgres: postgres
      frontend: frontend
      fairsplit_frontend: frontend

  pre_tasks:
    - name: Validate service_name is provided
      ansible.builtin.fail:
        msg: "Variable 'service_name' is required. Pass it with -e service_name=<service_or_container>"
      when: service_name == ''

    - name: Resolve target container and compose service names
      ansible.builtin.set_fact:
        resolved_container: "{{ service_to_container[service_name] | default(service_name) }}"
        resolved_compose_service: "{{ service_to_compose_service[service_name] | default(service_name) }}"

  tasks:
    - name: Get current timestamp
      ansible.builtin.command:
        cmd: date '+%Y-%m-%d %H:%M:%S'
      register: timestamp
      changed_when: false

    - name: Log remediation start
      ansible.builtin.lineinfile:
        path: "{{ remediation_log }}"
        line: "[{{ timestamp.stdout }}] REMEDIATION START: service={{ resolved_compose_service }} container={{ resolved_container }} host={{ inventory_hostname }}"
        create: true
        owner: ubuntu
        group: ubuntu
        mode: "0644"

    - name: Check container running state
      ansible.builtin.command:
        cmd: "docker inspect --format='{{ '{{' }}.State.Running{{ '}}' }}' {{ resolved_container }}"
      register: container_state
      changed_when: false
      failed_when: false

    - name: Log container state
      ansible.builtin.lineinfile:
        path: "{{ remediation_log }}"
        line: "[{{ timestamp.stdout }}] Container {{ resolved_container }} running: {{ container_state.stdout | default('not_found') }}"
        create: true
        mode: "0644"

    - name: Restart service via Docker Compose
      ansible.builtin.command:
        cmd: docker compose -f "{{ compose_file }}" restart "{{ resolved_compose_service }}"
        chdir: "{{ app_dir }}"
      become_user: ubuntu
      when: container_state.stdout != 'true' or container_state.rc != 0
      register: restart_result

    - name: Fallback to direct docker restart if compose restart did not trigger
      ansible.builtin.command:
        cmd: "docker restart {{ resolved_container }}"
      when: (container_state.stdout != 'true' or container_state.rc != 0) and (restart_result is not defined or restart_result.rc != 0)
      register: fallback_restart
      failed_when: false

    - name: Wait for service to stabilize after restart
      ansible.builtin.pause:
        seconds: "{{ wait_after_restart }}"
      when: (restart_result is defined and restart_result is changed) or (fallback_restart is defined and fallback_restart is changed)

    - name: Verify backend health endpoint if backend was remediated
      ansible.builtin.uri:
        url: "http://127.0.0.1/api/health/"
        method: GET
        status_code: [200, 201]
        timeout: 10
      register: health_check
      retries: "{{ health_check_retries }}"
      delay: "{{ health_check_delay }}"
      until: health_check.status in [200, 201]
      when: resolved_compose_service == 'backend'

    - name: Verify postgres readiness if postgres was remediated
      ansible.builtin.command:
        cmd: docker compose -f "{{ compose_file }}" exec -T postgres pg_isready -U fairsplit -d fairsplit
        chdir: "{{ app_dir }}"
      become_user: ubuntu
      register: pg_check
      retries: 5
      delay: 5
      until: pg_check.rc == 0
      when: resolved_compose_service == 'postgres'

    - name: Log remediation success
      ansible.builtin.lineinfile:
        path: "{{ remediation_log }}"
        line: "[{{ timestamp.stdout }}] REMEDIATION SUCCESS: service={{ resolved_compose_service }} container={{ resolved_container }} restored to healthy"
        create: true
        mode: "0644"
